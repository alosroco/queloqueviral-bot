name: QueloQue Viral

on:
  schedule:
    # 3 Reels de interes general fijos (el de las 9 es siempre de animales)
    - cron: "0 12 * * *"    # 09:00 Argentina
    - cron: "0 17 * * *"    # 14:00 Argentina
    - cron: "0 23 * * *"    # 20:00 Argentina
    # Radar de tendencias cada 2 horas (8:30 a 22:30 Argentina): hasta 2 oportunistas por dia
    # y los Reels a la carta que pidas con /tema
    - cron: "30 11,13,15,17,19,21,23,1 * * *"
  workflow_dispatch:        # boton para correrlo a mano
    inputs:
      modo:
        description: "normal = pide aprobacion y publica | prueba = solo Telegram | tiktok_link / tiktok_token = conectar TikTok"
        default: "normal"
        type: choice
        options: [normal, prueba, web, tiktok_link, tiktok_token]
      contenido:
        description: "Que tipo de Reel armar (auto = segun el horario)"
        default: "auto"
        type: choice
        options: [auto, interes, radar, noticias]
      codigo:
        description: "Solo para tiktok_token: el codigo que muestra la pagina de autorizacion"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: resumen-viral

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACIDAD: ${{ secrets.YT_PRIVACIDAD }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_CODIGO: ${{ github.event.inputs.codigo }}
      CONTENIDO: ${{ github.event_name == 'schedule' && (startsWith(github.event.schedule, '30 ') && 'radar' || 'interes') || github.event.inputs.contenido }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
      - run: pip install -q -r requirements.txt
      - name: Tipografia de la marca (Poppins)
        run: |
          mkdir -p fonts
          for f in Bold Medium; do
            curl -sfL -o fonts/Poppins-$f.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$f.ttf || true
          done

      - name: Armar el Reel y pedir aprobacion
        run: python noticias_bot.py ${{ github.event.inputs.modo || 'normal' }}

      - name: Subir archivos a GitHub Pages
        if: hashFiles('sitio/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - name: Publicar GitHub Pages
        if: hashFiles('sitio/index.html') != ''
        id: pages
        uses: actions/deploy-pages@v4

      - name: Publicar en Instagram, YouTube y TikTok
        if: hashFiles('pendiente.json') != ''
        env:
          PAGES_URL: ${{ steps.pages.outputs.page_url }}
        run: python noticias_bot.py publicar
