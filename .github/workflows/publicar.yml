name: QueloQue Viral

on:
  # Los turnos (8:17, 12:17, 17:17 y 20:47) los dispara el RELEVO (job de abajo) a la hora exacta: espera,
  # lanza el Reel y se vuelve a disparar a si mismo. El programador de GitHub queda solo como respaldo
  # (demora o saltea corridas): si el relevo se cortara, la proxima corrida programada lo reinicia.
  schedule:
    - cron: "17 11-23 * * *"   # 08:17 a 20:17 Argentina
    - cron: "47 23 * * *"      # 20:47 Argentina
    - cron: "17 0-2 * * *"     # 21:17 a 23:17 Argentina
  workflow_dispatch:        # boton para correrlo a mano
    inputs:
      modo:
        description: "normal = pide aprobacion y publica | prueba = solo Telegram | tiktok_link / tiktok_token = conectar TikTok"
        default: "normal"
        type: choice
        options: [normal, prueba, relevo, voces, youtube, web, tiktok_link, tiktok_token]
      contenido:
        description: "Que Reel armar"
        default: "mascotas"
        type: choice
        options: [mascotas, serie_mascota, vinculo, animales, varios, turno]
      codigo:
        description: "Solo para tiktok_token: el codigo que muestra la pagina de autorizacion"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write            # para que el relevo pueda lanzar las corridas

jobs:
  relevo:
    # Espera hasta el proximo turno, lo dispara y le pasa la posta a un relevo nuevo (cadena que no se corta).
    if: github.event_name == 'schedule' || github.event.inputs.modo == 'relevo'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: relevo
    steps:
      - name: Esperar el proximo turno y dispararlo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SEG=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          ar = timezone(timedelta(hours=-3)); ahora = datetime.now(ar)
          turnos = [(8, 17), (12, 17), (17, 17), (20, 47)]
          prox = min((ahora + timedelta(days=d)).replace(hour=h, minute=m, second=0, microsecond=0)
                     for d in (0, 1) for h, m in turnos
                     if (ahora + timedelta(days=d)).replace(hour=h, minute=m, second=0, microsecond=0) > ahora)
          print(int((prox - ahora).total_seconds()))
          ")
          LIMITE=$((330 * 60))
          if [ "$SEG" -le "$LIMITE" ]; then
            echo "Proximo turno en $((SEG / 60)) minutos: espero y lo disparo."
            sleep "$SEG"
            gh workflow run publicar.yml --repo "$GITHUB_REPOSITORY" -f modo=normal -f contenido=turno
            sleep 120
          else
            echo "El proximo turno esta lejos: espero 5 horas y media y paso la posta."
            sleep "$LIMITE"
          fi
          gh workflow run publicar.yml --repo "$GITHUB_REPOSITORY" -f modo=relevo

  publicar:
    if: github.event.inputs.modo != 'relevo'
    runs-on: ubuntu-24.04      # version fija: evita sorpresas cuando GitHub cambie ubuntu-latest
    timeout-minutes: 80
    concurrency:
      group: resumen-viral
    environment:
      name: github-pages
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_SECRETO: ${{ secrets.WORKER_SECRETO }}
      VERA_NOTICIAS: ${{ secrets.VERA_NOTICIAS }}
      VERA_ANIMALES: ${{ secrets.VERA_ANIMALES }}
      VERA_VARIOS: ${{ secrets.VERA_VARIOS }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACIDAD: ${{ secrets.YT_PRIVACIDAD }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_CODIGO: ${{ github.event.inputs.codigo }}
      CONTENIDO: ${{ (github.event_name == 'schedule' || github.event.inputs.contenido == 'turno') && 'interes' || github.event.inputs.contenido }}
      PROGRAMADA: ${{ github.event.schedule || (github.event.inputs.contenido == 'turno' && 'relevo' || '') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg (con reintentos si fallan los servidores de Ubuntu)
        run: |
          for intento in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing ffmpeg fonts-dejavu-core > /dev/null; then
              exit 0
            fi
            echo "La instalacion fallo (intento $intento de 3). Reintento en 30 segundos..."
            sleep 30
          done
          exit 1
      - run: pip install -q -r requirements.txt
      - name: Tipografia de la marca (Poppins)
        run: |
          mkdir -p fonts
          for f in Bold Medium; do
            curl -sfL -o fonts/Poppins-$f.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$f.ttf || true
          done

      - name: Armar el Reel y pedir aprobacion
        run: python noticias_bot.py ${{ github.event.inputs.modo || 'normal' }}

      - name: Subir archivos a GitHub Pages
        if: hashFiles('sitio/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - name: Publicar GitHub Pages
        if: hashFiles('sitio/index.html') != ''
        id: pages
        uses: actions/deploy-pages@v4

      - name: Publicar en Instagram, YouTube y TikTok
        if: hashFiles('pendiente.json') != ''
        env:
          PAGES_URL: ${{ steps.pages.outputs.page_url }}
        run: python noticias_bot.py publicar
