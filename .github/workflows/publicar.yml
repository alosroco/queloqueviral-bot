name: QueloQue Viral

on:
  schedule:
    # GitHub demora o saltea corridas, asi que lo intenta CADA HORA de 8 a 23 (Argentina). El bot arma solo
    # el turno que corresponde y todavia no salio (8:17, 12:17, 17:17 y 20:47); si ya salio, termina enseguida.
    - cron: "17 11-23 * * *"   # 08:17 a 20:17 Argentina
    - cron: "47 23 * * *"      # 20:47 Argentina
    - cron: "17 0-2 * * *"     # 21:17 a 23:17 Argentina
  workflow_dispatch:        # boton para correrlo a mano
    inputs:
      modo:
        description: "normal = pide aprobacion y publica | prueba = solo Telegram | tiktok_link / tiktok_token = conectar TikTok"
        default: "normal"
        type: choice
        options: [normal, prueba, voces, youtube, web, tiktok_link, tiktok_token]
      contenido:
        description: "Que Reel armar"
        default: "mascotas"
        type: choice
        options: [mascotas, serie_mascota, vinculo, animales, varios]
      codigo:
        description: "Solo para tiktok_token: el codigo que muestra la pagina de autorizacion"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: resumen-viral

jobs:
  publicar:
    runs-on: ubuntu-24.04      # version fija: evita sorpresas cuando GitHub cambie ubuntu-latest
    timeout-minutes: 80
    environment:
      name: github-pages
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_SECRETO: ${{ secrets.WORKER_SECRETO }}
      VERA_NOTICIAS: ${{ secrets.VERA_NOTICIAS }}
      VERA_ANIMALES: ${{ secrets.VERA_ANIMALES }}
      VERA_VARIOS: ${{ secrets.VERA_VARIOS }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACIDAD: ${{ secrets.YT_PRIVACIDAD }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_CODIGO: ${{ github.event.inputs.codigo }}
      CONTENIDO: ${{ github.event_name == 'schedule' && 'interes' || github.event.inputs.contenido }}
      PROGRAMADA: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg (con reintentos si fallan los servidores de Ubuntu)
        run: |
          for intento in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing ffmpeg fonts-dejavu-core > /dev/null; then
              exit 0
            fi
            echo "La instalacion fallo (intento $intento de 3). Reintento en 30 segundos..."
            sleep 30
          done
          exit 1
      - run: pip install -q -r requirements.txt
      - name: Tipografia de la marca (Poppins)
        run: |
          mkdir -p fonts
          for f in Bold Medium; do
            curl -sfL -o fonts/Poppins-$f.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$f.ttf || true
          done

      - name: Armar el Reel y pedir aprobacion
        run: python noticias_bot.py ${{ github.event.inputs.modo || 'normal' }}

      - name: Subir archivos a GitHub Pages
        if: hashFiles('sitio/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - name: Publicar GitHub Pages
        if: hashFiles('sitio/index.html') != ''
        id: pages
        uses: actions/deploy-pages@v4

      - name: Publicar en Instagram, YouTube y TikTok
        if: hashFiles('pendiente.json') != ''
        env:
          PAGES_URL: ${{ steps.pages.outputs.page_url }}
        run: python noticias_bot.py publicar
